name: build llamacpp-vulkan image

on:
  push:
    branches: [main]
    paths:
      - llamacpp-vulkan/**
      - .github/workflows/llamacpp-vulkan.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: llamacpp-vulkan-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space and move Docker onto the big ephemeral disk
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/az || true
          sudo apt-get clean || true
          docker image prune --all --force || true
          if mountpoint -q /mnt; then
            sudo systemctl stop docker.socket docker containerd || true
            for d in docker containerd; do
              sudo mkdir -p "/mnt/$d" "/var/lib/$d"
              sudo mount --bind "/mnt/$d" "/var/lib/$d"
            done
            sudo systemctl start containerd docker
          else
            echo "::warning::no separate /mnt disk on this runner - the build may run out of space"
          fi
          df -h / /mnt || true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/llamacpp-vulkan"
          STAMP="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          docker build --progress=plain \
            -f llamacpp-vulkan/Dockerfile \
            -t "$IMAGE:latest" -t "$IMAGE:$STAMP" \
            llamacpp-vulkan
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$STAMP"
          {
            echo "### Pushed"
            echo "- \`$IMAGE:latest\`"
            echo "- \`$IMAGE:$STAMP\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk usage
        if: always()
        run: |
          df -h / /mnt || true
          docker system df || true