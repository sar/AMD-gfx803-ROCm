name: build gfx803 image -> GHCR

on:
  workflow_dispatch:
    inputs:
      app:
        description: "What to build on top of the gfx803 ROCm base"
        type: choice
        options: [llamacpp, ollama]
        default: llamacpp
      max_jobs:
        description: "Parallel compile jobs (4 vCPU / 16 GB runner: keep at 4)"
        type: string
        default: "4"
      upstream_ref:
        description: "robertrosenbusch/gfx803_rocm branch / tag / commit (recorded in the image)"
        type: string
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space and move Docker onto the big ephemeral disk
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/az || true
          sudo apt-get clean || true
          docker image prune --all --force || true
          if mountpoint -q /mnt; then
            sudo systemctl stop docker.socket docker containerd || true
            for d in docker containerd; do
              sudo mkdir -p "/mnt/$d" "/var/lib/$d"
              sudo mount --bind "/mnt/$d" "/var/lib/$d"
            done
            sudo systemctl start containerd docker
          else
            echo "::warning::no separate /mnt disk on this runner - the build may run out of space"
          fi
          df -h / /mnt || true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ./Dockerfile and push to GHCR
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          APP="${{ inputs.app }}"
          T1="$IMAGE:$APP"
          T2="$IMAGE:$APP-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          docker build --progress=plain \
            --build-arg APP="$APP" \
            --build-arg MAX_JOBS="${{ inputs.max_jobs }}" \
            --build-arg UPSTREAM_REF="${{ inputs.upstream_ref }}" \
            -t "$T1" -t "$T2" .
          docker push "$T1"
          docker push "$T2"
          {
            echo "### Pushed"
            echo "- \`$T1\`"
            echo "- \`$T2\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disk usage
        if: always()
        run: |
          df -h / /mnt || true
          docker system df || true